PKG_IDS_JOOMLA_EB="IDS Joomla EB (pacote completo)"
PKG_IDS_JOOMLA_EB_XML_DESCRIPTION="<p><strong>Identidade visual do Governo Federal (gov.br/ds) para sites do Exército Brasileiro.</strong></p><p>Instala e mantém atualizados o template <em>IDS Gov - Exército Brasileiro</em>, os componentes <em>Aniversariantes</em> e <em>PagTesouro</em> e os módulos <em>IDS Gov</em> (Aniversariantes, Links, Popup, Instagram, Botão Leia Mais e Vídeos).</p><p>Compatível com Joomla 5.4 e Joomla 6. Novas versões são avisadas no painel inicial e em <em>Sistema → Atualizar → Extensões</em>.</p>"
