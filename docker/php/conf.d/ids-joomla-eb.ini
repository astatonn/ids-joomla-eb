; Limites para instalar o pacote IDS Joomla EB pelo painel.
upload_max_filesize = 32M
post_max_size = 34M

; Defesa em profundidade para PHP2Shell (CVE-2026-109618/CVE-2026-109619).
; A correcao completa e usar uma versao do PHP corrigida; esta opcao nao a substitui.
session.upload_progress.enabled = Off
