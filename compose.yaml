# Joomla + MySQL para experimentar o IDS Joomla EB localmente.
#
#   php build/build.php        # gera dist/pkg_ids_joomla_eb.zip (opcional)
#   docker compose up --build
#
# Site: http://localhost:8080  ·  Administrador: http://localhost:8080/administrator
# Usuário "joomla", senha "joomla@secured" (troque antes de qualquer uso real).
#
# Se dist/pkg_ids_joomla_eb.zip existir, o pacote é instalado automaticamente na primeira subida.
# Caso contrário, instale em Sistema → Instalar → Extensões.
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: joomla_db
      MYSQL_USER: joomla
      MYSQL_PASSWORD: examplepass
      MYSQL_RANDOM_ROOT_PASSWORD: '1'
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - joomla_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ujoomla -pexamplepass --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  joomla:
    build:
      context: .
      dockerfile: dockerfile
      args:
        JOOMLA_IMAGE: ${JOOMLA_IMAGE:-joomla:php8.3-apache}
    restart: unless-stopped
    ports:
      - "${JOOMLA_PORT:-8080}:80"
    environment:
      JOOMLA_DB_HOST: db
      JOOMLA_DB_USER: joomla
      JOOMLA_DB_PASSWORD: examplepass
      JOOMLA_DB_NAME: joomla_db
      JOOMLA_SITE_NAME: Joomla
      JOOMLA_ADMIN_USER: Joomla Hero
      JOOMLA_ADMIN_USERNAME: joomla
      JOOMLA_ADMIN_PASSWORD: joomla@secured
      JOOMLA_ADMIN_EMAIL: joomla@example.com
      # Instalado pela imagem oficial logo após a instalação do Joomla (ignorado se o arquivo não existir)
      JOOMLA_EXTENSIONS_PATHS: /extensions/pkg_ids_joomla_eb.zip
    volumes:
      - joomla_data:/var/www/html
      # Sem ":ro": o instalador do Joomla descompacta o pacote ao lado do arquivo
      - ./dist:/extensions
    networks:
      - joomla_network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  joomla_data:
  db_data:

networks:
  joomla_network:
