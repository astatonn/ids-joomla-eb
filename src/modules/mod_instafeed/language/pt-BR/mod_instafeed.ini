MOD_INSTAFEED="IDS Gov - Instagram"
MOD_INSTAFEED_XML_DESCRIPTION="Exibe o perfil do Instagram da Organização Militar com as publicações mais recentes, usando o recurso oficial de incorporação do Instagram. Os visitantes precisam ter acesso ao instagram.com."

