MOD_INSTAFEED_LARGURA_LABEL="Largura máxima (px)"
MOD_INSTAFEED_LARGURA_DESC="Largura máxima do quadro, em pixels. O padrão do Instagram é 540."
MOD_INSTAFEED_VER_PERFIL="Ver %s no Instagram"
