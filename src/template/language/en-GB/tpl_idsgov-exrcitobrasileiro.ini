TPL_IDSGOV_XML_DESCRIPTION="<p><strong>Template baseado no Padrão Digital de Governo (gov.br/ds) para sites do Exército Brasileiro.</strong></p><p>Compatível com Joomla 5.4 e Joomla 6. As configurações estão organizadas nas abas <em>Identidade</em>, <em>Aparência</em>, <em>Menu</em>, <em>Rodapé</em>, <em>Redes sociais</em> e <em>Cidadão e cookies</em>.</p><p>As atualizações aparecem em <em>Sistema → Atualizar → Extensões</em>.</p>"

